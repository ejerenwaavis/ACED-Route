name: Build Android Debug APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - 'client/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Local Routing Plugin
        run: |
          cd mobile/plugins/aced-routing
          npm install --legacy-peer-deps --no-audit
          npm run build

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm install --legacy-peer-deps --no-audit
          npm run build

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install --legacy-peer-deps --no-audit

      - name: Sync Capacitor Android
        run: |
          cd mobile
          npx cap sync android

      - name: Configure Gradle Environment
        run: |
          mkdir -p mobile/android
          touch mobile/android/gradle.properties
          echo "GOOGLE_MAPS_API_KEY=" >> mobile/android/gradle.properties

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x mobile/android/gradlew

      - name: Build Android Debug APK
        run: |
          set -o pipefail
          cd mobile/android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle.log
          echo "=== APK SEARCH ==="
          find . -name "*.apk"

      - name: Print Gradle Log on Failure
        if: failure()
        run: |
          echo "=== WHAT WENT WRONG ==="
          grep -A 15 "\* What went wrong:" mobile/android/gradle.log || cat mobile/android/gradle.log | tail -n 60
          ERR_MSG=$(grep -A 5 "\* What went wrong:" mobile/android/gradle.log | tr '\r\n' '  ')
          if [ -z "$ERR_MSG" ]; then
            ERR_MSG=$(tail -n 20 mobile/android/gradle.log | tr '\r\n' '  ')
          fi
          echo "::error title=Gradle Root Cause::$ERR_MSG"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aced-route-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Deploy APK to Namecheap Server
        env:
          SSH_KEY: ${{ secrets.NAMECHEAP_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.NAMECHEAP_HOST || secrets.SSH_HOST || '198.54.115.163' }}
          SSH_USER: ${{ secrets.NAMECHEAP_USER || secrets.SSH_USER || 'acedzagz' }}
          SSH_PORT: ${{ secrets.NAMECHEAP_PORT || secrets.SSH_PORT || '21098' }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::warning ::SSH_PRIVATE_KEY or NAMECHEAP_SSH_KEY secret not found in GitHub repository settings. Skipping SCP upload."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Deploying APK to $SSH_USER@$SSH_HOST:$SSH_PORT..."
          ssh -p $SSH_PORT -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SSH_USER@$SSH_HOST "mkdir -p /home/acedzagz/acedroute/public_html/download"
          scp -P $SSH_PORT -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa mobile/android/app/build/outputs/apk/debug/app-debug.apk $SSH_USER@$SSH_HOST:/home/acedzagz/acedroute/public_html/download/acedroute.apk
          echo "APK successfully published to https://route.aceddivision.com/download/acedroute.apk"
