name: Build Android Debug APK

on:
  push:
    branches: [ main, pin-fix ]
    paths:
      - 'mobile/**'
      - 'client/**'
      - 'server/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history needed for commit-count build number

      - name: Generate Build Number
        id: build_num
        run: |
          # Build number = YYYYMMDD.HHMM.short-sha  (e.g. 20260915.0741.900fb7b)
          BUILD_DATE=$(date -u +"%Y%m%d")
          BUILD_TIME=$(date -u +"%H%M")
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_NUMBER="${BUILD_DATE}.${BUILD_TIME}.${SHORT_SHA}"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Build number: ${BUILD_NUMBER}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure Dedicated Signing Keystore
        run: |
          mkdir -p mobile/android/app
          if [ -f mobile/android/app/acedroute.jks.base64 ]; then
            echo "Restoring dedicated keystore from committed base64..."
            base64 -d mobile/android/app/acedroute.jks.base64 > mobile/android/app/acedroute.keystore
          else
            echo "Generating dedicated permanent keystore..."
            keytool -genkeypair -v \
              -keystore mobile/android/app/acedroute.keystore \
              -alias acedroute \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass acedroute123 \
              -keypass acedroute123 \
              -dname "CN=ACED Route, OU=Mobile, O=ACED Division, L=Atlanta, ST=GA, C=US"
            base64 -w 0 mobile/android/app/acedroute.keystore > mobile/android/app/acedroute.jks.base64
            echo "::notice title=Generated Keystore::$(cat mobile/android/app/acedroute.jks.base64)"
          fi
          echo "=== KEYSTORE CERTIFICATE FINGERPRINTS ==="
          keytool -list -v -keystore mobile/android/app/acedroute.keystore -alias acedroute -storepass acedroute123 | grep -E "SHA1|SHA256"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'

      - name: Build Local Routing Plugin
        run: |
          cd mobile/plugins/aced-routing
          npm install --legacy-peer-deps --no-audit
          npm run build

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm install --legacy-peer-deps --no-audit
          npm run build

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install --legacy-peer-deps --no-audit

      - name: Sync Capacitor Android
        run: |
          cd mobile
          npx cap sync android

      - name: Configure Gradle Environment
        run: |
          mkdir -p mobile/android
          cat << 'EOF' > mobile/android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=36
          org.gradle.jvmargs=-Xmx2048m
          GOOGLE_MAPS_API_KEY=
          EOF
          mkdir -p mobile/plugins/aced-routing/android
          cp mobile/android/gradle.properties mobile/plugins/aced-routing/android/gradle.properties

      - name: Stamp Build Number into APK manifest
        run: |
          BUILD_NUMBER="${{ steps.build_num.outputs.BUILD_NUMBER }}"
          GRADLE_FILE="mobile/android/app/build.gradle"
          # Increment versionCode by commit count; embed build number in versionName
          COMMIT_COUNT=$(git rev-list --count HEAD)
          sed -i "s/versionCode .*/versionCode ${COMMIT_COUNT}/" "$GRADLE_FILE" || true
          sed -i "s/versionName \"[^\"]*\"/versionName \"${BUILD_NUMBER}\"/" "$GRADLE_FILE" || true
          echo "Stamped: versionCode=${COMMIT_COUNT} versionName=${BUILD_NUMBER}"

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x mobile/android/gradlew

      - name: Build Android Debug APK
        run: |
          set -o pipefail
          cd mobile/android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle.log
          echo "=== APK SEARCH ==="
          find . -name "*.apk"

      - name: Print Gradle Log on Failure
        if: failure()
        run: |
          echo "=== WHAT WENT WRONG ==="
          grep -A 15 "\* What went wrong:" mobile/android/gradle.log || cat mobile/android/gradle.log | tail -n 60
          ERR_MSG=$(grep -A 5 "\* What went wrong:" mobile/android/gradle.log | tr '\r\n' '  ')
          if [ -z "$ERR_MSG" ]; then
            ERR_MSG=$(tail -n 20 mobile/android/gradle.log | tr '\r\n' '  ')
          fi
          echo "::error title=Gradle Root Cause::$ERR_MSG"

      - name: Prepare Named APK (with build number)
        run: |
          BUILD_NUMBER="${{ steps.build_num.outputs.BUILD_NUMBER }}"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             mobile/android/app/build/outputs/apk/debug/acedroute.apk
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             mobile/android/app/build/outputs/apk/debug/acedroute-${BUILD_NUMBER}.apk
          echo "APK files prepared:"
          ls -lh mobile/android/app/build/outputs/apk/debug/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aced-route-debug-apk-${{ steps.build_num.outputs.BUILD_NUMBER }}
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish GitHub Release (Latest APK)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pin-fix'
        with:
          tag_name: latest-apk
          name: "ACED Route Mobile App — Build ${{ steps.build_num.outputs.BUILD_NUMBER }}"
          body: |
            **Build:** `${{ steps.build_num.outputs.BUILD_NUMBER }}`
            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`

            Automated cloud build of the ACED Route offline navigation Android app.
          prerelease: false
          draft: false
          files: |
            mobile/android/app/build/outputs/apk/debug/acedroute.apk
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APK to Namecheap Server
        env:
          SSH_KEY: ${{ secrets.NAMECHEAP_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.NAMECHEAP_HOST || secrets.SSH_HOST || '198.54.115.163' }}
          SSH_USER: ${{ secrets.NAMECHEAP_USER || secrets.SSH_USER || 'acedzagz' }}
          SSH_PORT: ${{ secrets.NAMECHEAP_PORT || secrets.SSH_PORT || '21098' }}
          BUILD_NUMBER: ${{ steps.build_num.outputs.BUILD_NUMBER }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::warning ::SSH_PRIVATE_KEY or NAMECHEAP_SSH_KEY secret not found. Skipping SCP upload."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Deploying APK to $SSH_USER@$SSH_HOST:$SSH_PORT..."
          ssh -p $SSH_PORT -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SSH_USER@$SSH_HOST \
            "mkdir -p /home/acedzagz/acedroute/public_html/download"
          scp -P $SSH_PORT -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            $SSH_USER@$SSH_HOST:/home/acedzagz/acedroute/public_html/download/acedroute.apk
          echo "APK successfully published to https://route.aceddivision.com/download/acedroute.apk"
          echo "Build number: ${BUILD_NUMBER}"

      - name: Deploy Server Changes to Namecheap (if server/ changed)
        env:
          SSH_KEY: ${{ secrets.NAMECHEAP_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.NAMECHEAP_HOST || secrets.SSH_HOST || '198.54.115.163' }}
          SSH_USER: ${{ secrets.NAMECHEAP_USER || secrets.SSH_USER || 'acedzagz' }}
          SSH_PORT: ${{ secrets.NAMECHEAP_PORT || secrets.SSH_PORT || '21098' }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "No SSH key — skipping server deploy."
            exit 0
          fi

          # Only pull + restart if server/ files changed in this push
          SERVER_CHANGED=$(git diff --name-only HEAD~1 HEAD -- server/ 2>/dev/null || echo "")
          if [ -z "$SERVER_CHANGED" ]; then
            echo "No server/ changes detected — skipping server deploy."
            exit 0
          fi

          echo "Server changes detected:"
          echo "$SERVER_CHANGED"

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Pulling server updates and restarting app on Namecheap..."
          ssh -p $SSH_PORT -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SSH_USER@$SSH_HOST << 'ENDSSH'
            set -e
            cd /home/acedzagz/acedroute
            git pull origin main
            # Restart the Node.js app via Passenger (touch tmp/restart.txt)
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Server restarted at $(date)"
          ENDSSH
          echo "Server deploy complete."
