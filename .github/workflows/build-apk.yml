name: Build Android Debug APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - 'client/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm install
          npm run build

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Sync Capacitor Android
        run: |
          cd mobile
          npx cap sync android

      - name: Configure Gradle Environment
        run: |
          mkdir -p mobile/android
          touch mobile/android/gradle.properties
          echo "GOOGLE_MAPS_API_KEY=" >> mobile/android/gradle.properties

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x mobile/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aced-route-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
